<title>Lectio Vulgata</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Merriweather:ital,wght@0,300;0,400;0,700;1,300;1,400&family=Source+Sans+3:wght@400;500;600&display=swap">
<script>/* the Latin font chosen in the header (FontSwitch): set before the page draws */
window.LV_FONTS = { merriweather: ["Merriweather", ""], alegreya: ["Alegreya", "Alegreya:ital,wght@0,400;0,700;1,400"], garamond: ["EB Garamond", "EB+Garamond:ital,wght@0,400;0,700;1,400"], gentium: ["Gentium Book Plus", "Gentium+Book+Plus:ital,wght@0,400;0,700;1,400"], cardo: ["Cardo", "Cardo:ital,wght@0,400;0,700;1,400"], literata: ["Literata", "Literata:ital,wght@0,400;0,700;1,400"] };
window.LV_setFont = function (k) { var f = window.LV_FONTS[k] || window.LV_FONTS.merriweather; if (f[1] && !document.getElementById("lvf-" + k)) { var l = document.createElement("link"); l.id = "lvf-" + k; l.rel = "stylesheet"; l.href = "https://fonts.googleapis.com/css2?family=" + f[1] + "&display=swap"; document.head.appendChild(l); } document.documentElement.style.setProperty("--font-latin", '"' + f[0] + '", Georgia, "Times New Roman", serif'); };
try { var lf = JSON.parse(localStorage.getItem("lectio-vulgata-font") || "null"); if (lf && lf !== "merriweather") window.LV_setFont(lf); } catch (e) {}</script>
<script>/* display settings (DisplayPanel): text size, Latin line spacing, page width */
try { var dd = JSON.parse(localStorage.getItem("lectio-vulgata-display") || "null") || {}, dr = document.documentElement; if (dd.size) dr.style.setProperty("--lv-zoom", dd.size); if (dd.lh === "roomy") dr.setAttribute("data-lh", "roomy"); if (dd.wide) dr.setAttribute("data-wide", "1"); } catch (e) {}</script>
<script>try { var th = JSON.parse(localStorage.getItem("lectio-vulgata-theme") || "null"); if (th === "dark" || th === "light") document.documentElement.setAttribute("data-theme", th); } catch (e) {}</script>
<style>
  /* Layout: one quiet reading column, like a single page of a breviary; a progress ledger above, the verse in the middle, grading below. */
  /* Single deliberate paper theme (user asked for a #f8f6f0 stone background). */
  :root {
    color-scheme: light;
    --paper: #f8f6f0;
    --leaf: #fffdf8;
    --ink: #2a2622;
    --ink-soft: #6b625a;
    --rule: #e3ddd0;
    --rubric: #9a2b22;
    --rubric-tint: #f4e6e1;
    --ok: #3f6b3a;
    --ok-tint: #e7efe2;
    --mid: #5b5f86;
    --mid-tint: #e8e9f2;
    --warn: #8a6113;
    --warn-tint: #f6ecd6;
    --g1: #2f62a8; --g1-tint: #e3ecf8; --g2: #3f7a3a; --g2-tint: #e5f0e1; --g3: #7a3f98; --g3-tint: #f0e6f6;
    --g4: #94640e; --g4-tint: #f7edd6; --g5: #1f7a78; --g5-tint: #dff1f0; --g6: #a8325e; --g6-tint: #f8e4ec;
    --font-latin: "Merriweather", Georgia, "Times New Roman", serif;
    --font-ui: "Source Sans 3", "Segoe UI", system-ui, sans-serif;
  }
  /* Dark: for reading the Office at night. Follows the device unless chosen in the header (data-theme). */
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      color-scheme: dark;
      --paper: #1b1916; --leaf: #23201c; --ink: #ebe4d6; --ink-soft: #a99f91; --rule: #3a342c;
      --rubric: #e2806f; --rubric-tint: #3b2420; --ok: #93c48a; --ok-tint: #22301f;
      --mid: #a9addb; --mid-tint: #282b3f; --warn: #dcb565; --warn-tint: #352b16;
      --g1: #8fb3ea; --g1-tint: #1e2a3d; --g2: #93c48a; --g2-tint: #22301f; --g3: #c69be0; --g3-tint: #2f2238;
      --g4: #e0b862; --g4-tint: #362b15; --g5: #7fcfcb; --g5-tint: #183331; --g6: #ec97b6; --g6-tint: #3a1f2a;
    }
  }
  :root[data-theme="dark"] {
    color-scheme: dark;
    --paper: #1b1916; --leaf: #23201c; --ink: #ebe4d6; --ink-soft: #a99f91; --rule: #3a342c;
    --rubric: #e2806f; --rubric-tint: #3b2420; --ok: #93c48a; --ok-tint: #22301f;
    --mid: #a9addb; --mid-tint: #282b3f; --warn: #dcb565; --warn-tint: #352b16;
    --g1: #8fb3ea; --g1-tint: #1e2a3d; --g2: #93c48a; --g2-tint: #22301f; --g3: #c69be0; --g3-tint: #2f2238;
    --g4: #e0b862; --g4-tint: #362b15; --g5: #7fcfcb; --g5-tint: #183331; --g6: #ec97b6; --g6-tint: #3a1f2a;
  }
  html, body { background: var(--paper); color: var(--ink); }
  body { font-family: var(--font-ui); font-size: 16px; }
  .wrap {
    max-width: 46rem; margin: 0 auto;
    padding-left: max(16px, env(safe-area-inset-left, 0px));
    padding-right: max(16px, env(safe-area-inset-right, 0px));
    padding-block: 1.5rem 3rem;
  }
  .latin { font-family: var(--font-latin); }
  #root { zoom: var(--lv-zoom, 1); }
  html[data-wide] .wrap { max-width: 64rem; }
  html[data-lh="roomy"] p.latin, html[data-lh="roomy"] .lt { line-height: 2.15 !important; }
  .gh { background: var(--rubric-tint); color: var(--rubric); border-radius: 3px; box-shadow: 0 0 0 2px var(--rubric-tint); }
  .smallcaps { font-variant-caps: all-small-caps; letter-spacing: .08em; }
  .num { font-variant-numeric: tabular-nums; }
  .initial::first-letter {
    color: var(--rubric); font-weight: 700; float: left;
    font-size: 3.1em; line-height: .9; padding: .06em .03em 0 0; margin-right: -.02em;
  }
  textarea:focus, select:focus, input:focus, button:focus-visible {
    outline: 2px solid var(--rubric); outline-offset: 2px;
  }
  .lw { cursor: pointer; border-radius: 3px; transition: background-color .12s; }
  .lw:hover { background: var(--rubric-tint); }
  .cq { text-decoration: underline var(--rubric) 2px; text-underline-offset: 4px; }
  .lw.sel { background: var(--rubric-tint); box-shadow: inset 0 -2px 0 var(--rubric); }
  .lw:focus-visible { outline: 2px solid var(--rubric); outline-offset: 1px; }
  .mk { border-radius: 3px; cursor: pointer; padding: 0 1px; color: inherit; }
  .mk-error, .lw.mk-error { background: var(--rubric-tint); box-shadow: inset 0 -2px 0 var(--rubric); }
  .mk-minor, .lw.mk-minor { background: var(--mid-tint); box-shadow: inset 0 -2px 0 var(--mid); }
  .mk-on { outline: 2px solid var(--rubric); outline-offset: 1px; }
  .mk-n { font-family: var(--font-ui); font-size: .58em; font-weight: 700; color: var(--rubric); margin-left: 1px; font-style: normal; }
  .mk-minor .mk-n { color: var(--mid); }
  .tutor-dot { width: 10px; height: 10px; border-radius: 50%; background: var(--rubric); animation: pulse 0.9s ease-in-out infinite alternate; }
  @keyframes pulse { from { opacity: .25; } to { opacity: 1; } }
  @media (prefers-reduced-motion: reduce) { .tutor-dot { animation: none; } }
  /* Reading aids */
  .lt { zoom: var(--lz, 1); }
  .st-v { font-weight: 700; color: var(--rubric); }
  .st-nf { font-style: italic; text-decoration: underline dotted var(--rubric); text-underline-offset: 4px; }
  .st-sub { color: var(--mid); background: var(--mid-tint); border-radius: 3px; padding: 0 2px; }
  .st-nom { text-decoration: underline solid var(--ok); text-decoration-thickness: 2px; text-underline-offset: 4px; }
  /* Find the skeleton */
  .sk { cursor: pointer; border-radius: 3px; padding: 0 1px; transition: background-color .12s; }
  .sk:hover { background: var(--rule); }
  .sk:focus-visible { outline: 2px solid var(--rubric); outline-offset: 1px; }
  .sk-on, .sk-on:hover { background: var(--rubric-tint); box-shadow: inset 0 -2px 0 var(--rubric); }
  .sk-ok, .sk-ok:hover { background: var(--ok-tint); box-shadow: inset 0 -2px 0 var(--ok); }
  .sk-miss { outline: 2px dashed var(--warn); outline-offset: 1px; }
  .sk-bad, .sk-bad:hover { background: var(--warn-tint); text-decoration: line-through var(--warn) 2px; }
  .reveal { animation: rise .25s ease-out both; }
  @keyframes rise { from { opacity: .4; transform: translateY(4px); } to { opacity: 1; transform: none; } }
  @media (prefers-reduced-motion: reduce) { .reveal { animation: none; } }
</style>
