<title>Lectio Vulgata</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Merriweather:ital,wght@0,300;0,400;0,700;1,300;1,400&family=Source+Sans+3:wght@400;500;600&display=swap">
<style>
  /* Layout: one quiet reading column, like a single page of a breviary; a progress ledger above, the verse in the middle, grading below. */
  /* Single deliberate paper theme (user asked for a #f8f6f0 stone background). */
  :root {
    color-scheme: light;
    --paper: #f8f6f0;
    --leaf: #fffdf8;
    --ink: #2a2622;
    --ink-soft: #6b625a;
    --rule: #e3ddd0;
    --rubric: #9a2b22;
    --rubric-tint: #f4e6e1;
    --ok: #3f6b3a;
    --ok-tint: #e7efe2;
    --mid: #5b5f86;
    --mid-tint: #e8e9f2;
    --warn: #8a6113;
    --warn-tint: #f6ecd6;
    --font-latin: "Merriweather", Georgia, "Times New Roman", serif;
    --font-ui: "Source Sans 3", "Segoe UI", system-ui, sans-serif;
  }
  html, body { background: var(--paper); color: var(--ink); }
  body { font-family: var(--font-ui); font-size: 16px; }
  .wrap {
    max-width: 46rem; margin: 0 auto;
    padding-left: max(16px, env(safe-area-inset-left, 0px));
    padding-right: max(16px, env(safe-area-inset-right, 0px));
    padding-block: 1.5rem 3rem;
  }
  .latin { font-family: var(--font-latin); }
  .smallcaps { font-variant-caps: all-small-caps; letter-spacing: .08em; }
  .num { font-variant-numeric: tabular-nums; }
  .initial::first-letter {
    color: var(--rubric); font-weight: 700; float: left;
    font-size: 3.1em; line-height: .9; padding: .06em .12em 0 0;
  }
  textarea:focus, select:focus, input:focus, button:focus-visible {
    outline: 2px solid var(--rubric); outline-offset: 2px;
  }
  .lw { cursor: pointer; border-radius: 3px; transition: background-color .12s; }
  .lw:hover { background: var(--rubric-tint); }
  .lw.sel { background: var(--rubric-tint); box-shadow: inset 0 -2px 0 var(--rubric); }
  .lw:focus-visible { outline: 2px solid var(--rubric); outline-offset: 1px; }
  .mk { border-radius: 3px; cursor: pointer; padding: 0 1px; color: inherit; }
  .mk-error, .lw.mk-error { background: var(--rubric-tint); box-shadow: inset 0 -2px 0 var(--rubric); }
  .mk-minor, .lw.mk-minor { background: var(--mid-tint); box-shadow: inset 0 -2px 0 var(--mid); }
  .mk-on { outline: 2px solid var(--rubric); outline-offset: 1px; }
  .mk-n { font-family: var(--font-ui); font-size: .58em; font-weight: 700; color: var(--rubric); margin-left: 1px; font-style: normal; }
  .mk-minor .mk-n { color: var(--mid); }
  .tutor-dot { width: 10px; height: 10px; border-radius: 50%; background: var(--rubric); animation: pulse 0.9s ease-in-out infinite alternate; }
  @keyframes pulse { from { opacity: .25; } to { opacity: 1; } }
  @media (prefers-reduced-motion: reduce) { .tutor-dot { animation: none; } }
  /* Reading aids */
  .lt { zoom: var(--lz, 1); }
  .st-v { font-weight: 700; color: var(--rubric); }
  .st-nf { font-style: italic; text-decoration: underline dotted var(--rubric); text-underline-offset: 4px; }
  .st-sub { color: var(--mid); background: var(--mid-tint); border-radius: 3px; padding: 0 2px; }
  .st-nom { text-decoration: underline solid var(--ok); text-decoration-thickness: 2px; text-underline-offset: 4px; }
  /* Find the skeleton */
  .sk { cursor: pointer; border-radius: 3px; padding: 0 1px; transition: background-color .12s; }
  .sk:hover { background: var(--rule); }
  .sk:focus-visible { outline: 2px solid var(--rubric); outline-offset: 1px; }
  .sk-on, .sk-on:hover { background: var(--rubric-tint); box-shadow: inset 0 -2px 0 var(--rubric); }
  .sk-ok, .sk-ok:hover { background: var(--ok-tint); box-shadow: inset 0 -2px 0 var(--ok); }
  .sk-miss { outline: 2px dashed var(--warn); outline-offset: 1px; }
  .sk-bad, .sk-bad:hover { background: var(--warn-tint); text-decoration: line-through var(--warn) 2px; }
  .reveal { animation: rise .25s ease-out both; }
  @keyframes rise { from { opacity: .4; transform: translateY(4px); } to { opacity: 1; transform: none; } }
  @media (prefers-reduced-motion: reduce) { .reveal { animation: none; } }
</style>

<script>const{useState,useEffect,useMemo,useRef}=React,CONCEPTS={abl:"Ablative uses",gen:"Genitive uses",dat:"Dative uses",fut:"Future tenses",perf:"Perfect system",pass:"Passive & fio",dep:"Deponent verbs",imp:"Imperatives",subj:"Subjunctive",part:"Participles & gerundives",rel:"Relative clauses",comp:"Comparison",ellip:"Omitted words",order:"Word order",absl:"Ablative absolute",ind:"Indirect statement"},LEVELS={1:"Beginner",2:"Intermediate",3:"Advanced"},VERSES=[{id:"mt4-4",ref:"Matthew 4:4",g:"Gospels",lv:2,k:["rel","part","pass","abl"],la:"Qui respondens dixit: Scriptum est: Non in solo pane vivit homo, sed in omni verbo, quod procedit de ore Dei.",dr:"Who answered and said: It is written, Not in bread alone doth man live, but in every word that proceedeth from the mouth of God.",p:[["qui respondens dixit","connecting relative: qui = \u201Cand he\u201D. Respondens is a present participle: \u201Canswering, he said\u201D."],["scriptum est","perfect passive of scribo: \u201Cit stands written\u201D."],["in solo pane","in + abl.; solus is a pronominal adjective (gen. solius, dat. soli)."],["quod procedit","relative clause on verbo; neuter quod matches verbum."],["de ore Dei","de + abl. of os, oris (n.) \u201Cmouth\u201D."]],v:[["respondeo, -ere","to answer"],["panis, -is (m.)","bread"],["procedo, -ere","to go forth"],["os, oris (n.)","mouth"]],t:"A relative pronoun opening a sentence usually just links back: translate qui as \u201Che\u201D or \u201Cand he\u201D."},{id:"mt5-3",ref:"Matthew 5:3",g:"Gospels",lv:1,k:["ellip","abl","gen"],la:"Beati pauperes spiritu: quoniam ipsorum est regnum caelorum.",dr:"Blessed are the poor in spirit: for theirs is the kingdom of heaven.",p:[["beati","nom. pl. masc. adjective; sunt is understood."],["pauperes","nom. pl. of pauper, -eris (3rd decl.)."],["spiritu","abl. sg. of spiritus, -us (4th decl.): ablative of respect, \u201Cin spirit\u201D."],["ipsorum est","gen. pl. of ipse with est: possessive genitive, \u201Ctheirs is\u201D."],["regnum caelorum","nom. sg. subject + gen. pl. of caelum."]],v:[["beatus, -a, -um","blessed, happy"],["pauper, -eris","poor"],["quoniam","because, since"],["regnum, -i (n.)","kingdom"]],t:"Verbless clauses are common in the Beatitudes. Supply a form of esse."},{id:"mt6-9",ref:"Matthew 6:9",g:"Gospels",lv:1,k:["fut","subj","pass","rel"],la:"Sic ergo vos orabitis: Pater noster, qui es in caelis: sanctificetur nomen tuum.",dr:"Thus therefore shall you pray: Our Father who art in heaven, hallowed be thy name.",p:[["orabitis","2nd pl. future of oro (1st conj., -bi-), with the force of a command."],["Pater","vocative, identical to the nominative here."],["qui es","2nd sg. verb because the antecedent is being addressed."],["sanctificetur","3rd sg. present passive subjunctive, jussive: \u201Clet it be hallowed\u201D."],["nomen tuum","nom. sg. neut., subject of the passive verb."]],v:[["oro, -are","to pray"],["caelum, -i (n.)","heaven, sky"],["sanctifico, -are","to make holy"],["nomen, -inis (n.)","name"]],t:"A present subjunctive in a main clause is usually a wish or command: \u201Clet\u2026\u201D, \u201Cmay\u2026\u201D."},{id:"mt7-7",ref:"Matthew 7:7",g:"Gospels",lv:1,k:["imp","fut","pass"],la:"Petite, et dabitur vobis: quaerite, et invenietis: pulsate, et aperietur vobis.",dr:"Ask, and it shall be given you: seek, and you shall find: knock, and it shall be opened to you.",p:[["petite, quaerite, pulsate","2nd pl. present imperatives."],["dabitur","3rd sg. future passive of do: \u201Cit will be given\u201D."],["invenietis","2nd pl. future of invenio (4th conj., -ie-)."],["aperietur","3rd sg. future passive of aperio (4th conj.)."],["vobis","dat. pl.: \u201Cto you\u201D."]],v:[["peto, -ere","to ask, seek"],["quaero, -ere","to seek"],["pulso, -are","to knock"],["aperio, -ire","to open"]],t:"Imperative + et + future works like a condition: \u201Cask, and (if you do) you will receive\u201D."},{id:"mt11-28",ref:"Matthew 11:28",g:"Gospels",lv:1,k:["imp","fut","rel","pass"],la:"Venite ad me omnes qui laboratis, et onerati estis, et ego reficiam vos.",dr:"Come to me all you that labor and are burdened, and I will refresh you.",p:[["venite","2nd pl. present imperative of venio."],["qui laboratis","relative clause in the 2nd person because it refers to the people addressed."],["onerati estis","2nd pl. perfect passive of onero: \u201Cyou are (have been) burdened\u201D."],["reficiam","1st sg. future of reficio (3rd -io). In the 3rd/4th conjugations, -am is future in the 1st person."]],v:[["laboro, -are","to toil, labor"],["onero, -are","to load, burden"],["reficio, -ere","to restore, refresh"]],t:"Reficiam could be present subjunctive in form. Context with et ego makes it a promise: future."},{id:"mt16-18",ref:"Matthew 16:18",g:"Gospels",lv:2,k:["fut","dat","gen"],la:"Et ego dico tibi, quia tu es Petrus, et super hanc petram aedificabo Ecclesiam meam, et portae inferi non praevalebunt adversus eam.",dr:"And I say to thee: That thou art Peter; and upon this rock I will build my church, and the gates of hell shall not prevail against it.",p:[["dico tibi","dative of indirect object: \u201CI say to you\u201D."],["quia","introduces a direct statement, like Greek hoti. Late Latin uses quia where classical Latin uses an infinitive."],["super hanc petram","super + accusative; petra plays on Petrus."],["aedificabo","1st sg. future of aedifico (1st conj.)."],["portae inferi","nom. pl. + genitive: \u201Cgates of the underworld\u201D."],["praevalebunt","3rd pl. future of praevaleo (2nd conj., -bu-)."]],v:[["petra, -ae (f.)","rock"],["aedifico, -are","to build"],["infernus / inferi","underworld, hell"],["adversus (+ acc.)","against"]],t:"Watch for quia introducing speech; it often just means a colon or \u201Cthat\u201D."},{id:"mt22-37",ref:"Matthew 22:37",g:"Gospels",lv:2,k:["fut","abl","dat"],la:"Ait illi Iesus: Diliges Dominum Deum tuum ex toto corde tuo, et in tota anima tua, et in tota mente tua.",dr:"Jesus said to him: Thou shalt love the Lord thy God with thy whole heart, and with thy whole soul, and with thy whole mind.",p:[["ait illi","ait, a defective verb of saying; illi is dat. sg. of ille."],["diliges","2nd sg. future of diligo, used as a command: \u201Cthou shalt love\u201D."],["ex toto corde tuo","ex + abl. of cor, cordis (n.); totus has gen. totius, dat. toti."],["in tota anima, in tota mente","in + ablative, \u201Cwith\u201D."]],v:[["aio (defective)","to say"],["cor, cordis (n.)","heart"],["anima, -ae (f.)","soul, life"],["mens, mentis (f.)","mind"]],t:"A future in a commandment is translated \u201Cthou shalt\u201D or \u201Cyou shall\u201D."},{id:"mt28-19",ref:"Matthew 28:19",g:"Gospels",lv:2,k:["part","imp","gen"],la:"Euntes ergo docete omnes gentes: baptizantes eos in nomine Patris, et Filii, et Spiritus Sancti:",dr:"Going therefore, teach ye all nations; baptizing them in the name of the Father, and of the Son, and of the Holy Ghost.",p:[["euntes","nom. pl. present participle of eo: \u201Cgoing\u201D."],["docete","2nd pl. imperative of doceo (2nd conj.)."],["omnes gentes","acc. pl. of gens, gentis (f.) \u201Cnation\u201D."],["baptizantes","present participle, nom. pl., agreeing with the understood subject of docete."],["in nomine Patris\u2026","in + abl. of nomen, followed by three genitives."]],v:[["eo, ire, ii","to go"],["doceo, -ere","to teach"],["gens, gentis (f.)","nation, people"]],t:"Participles agree with the subject of the command, even when that subject (\u201Cyou\u201D) is unstated."},{id:"mk1-15",ref:"Mark 1:15",g:"Gospels",lv:2,k:["dep","imp","part","dat","perf"],la:"et dicens: Quoniam impletum est tempus, et appropinquavit regnum Dei: poenitemini, et credite Evangelio.",dr:"And saying: The time is accomplished, and the kingdom of God is at hand: repent, and believe the gospel.",p:[["dicens","present participle of dico: \u201Csaying\u201D."],["quoniam","introduces the quoted words, like quia; leave it untranslated."],["impletum est","perfect passive of impleo: \u201Chas been fulfilled\u201D."],["appropinquavit","perfect of appropinquo: \u201Chas drawn near\u201D."],["poenitemini","2nd pl. imperative of the deponent poeniteor: passive form, active command, \u201Crepent\u201D."],["credite Evangelio","credo takes the dative: \u201Cbelieve the gospel\u201D."]],v:[["impleo, -ere","to fill, fulfil"],["appropinquo, -are","to approach"],["poeniteor (dep.)","to repent"]],t:"A deponent imperative in -mini looks like a 2nd pl. passive. Context makes it a command."},{id:"mk8-36",ref:"Mark 8:36",g:"Gospels",lv:3,k:["subj","dep","dat","fut"],la:"Quid enim proderit homini, si lucretur mundum totum et detrimentum animae suae faciat?",dr:"For what shall it profit a man, if he gain the whole world, and suffer the loss of his soul?",p:[["proderit","3rd sg. future of prosum (prod- before vowels), with the dative homini: \u201Cbenefit a man\u201D."],["si lucretur","present subjunctive of the deponent lucror: a hypothetical condition."],["mundum totum","acc. object of lucretur; totus \u201Cwhole\u201D (gen. totius, dat. toti)."],["detrimentum \u2026 faciat","idiom: \u201Csuffer loss\u201D. Faciat is present subjunctive."],["animae suae","genitive: \u201Cof his soul\u201D."]],v:[["prosum, prodesse","to benefit, profit (+ dat.)"],["lucror, -ari (dep.)","to gain"],["detrimentum, -i (n.)","loss, damage"]],t:"Prosum is sum with pro-/prod-: learn sum\u2019s forms and you know prosum\u2019s."},{id:"mk16-15",ref:"Mark 16:15",g:"Gospels",lv:2,k:["part","imp","dat"],la:"Et dixit eis: Euntes in mundum universum praedicate Evangelium omni creaturae.",dr:"And he said to them: Go ye into the whole world, and preach the gospel to every creature.",p:[["eis","dat. pl. of is: \u201Cto them\u201D."],["euntes","nom. pl. present participle of eo: \u201Cgoing\u201D. English turns it into a second command."],["in mundum universum","in + accusative: motion into."],["praedicate","2nd pl. imperative of praedico (1st conj.)."],["omni creaturae","dat. sg. fem.: \u201Cto every creature\u201D."]],v:[["eo, ire, ii","to go"],["universus, -a, -um","whole, entire"],["praedico, -are","to proclaim, preach"]],t:"A participle + imperative often becomes two imperatives in English: \u201CGo \u2026 and preach\u201D."},{id:"lk1-28",ref:"Luke 1:28",g:"Gospels",lv:2,k:["dep","part","abl","imp","ellip"],la:"Et ingressus angelus ad eam dixit: Ave gratia plena: Dominus tecum: benedicta tu in mulieribus.",dr:"And the angel being come in, said unto her: Hail, full of grace, the Lord is with thee: blessed art thou among women.",p:[["ingressus","perfect participle of the deponent ingredior: \u201Chaving entered\u201D."],["ave","imperative used as a greeting: \u201Chail\u201D."],["gratia plena","plenus with the ablative (classical prose prefers the genitive): \u201Cfull of grace\u201D."],["tecum","cum + te, with cum attached as an enclitic. Est is understood."],["in mulieribus","in + abl. pl. of mulier: \u201Camong women\u201D, a Hebrew way of saying \u201Cmost blessed\u201D."]],v:[["ingredior, -i, ingressus","to go in, enter"],["plenus, -a, -um","full"],["benedictus, -a, -um","blessed"],["mulier, -eris (f.)","woman"]],t:"Perfect participles of deponents are active: ingressus = \u201Chaving entered\u201D."},{id:"lk1-38",ref:"Luke 1:38a",g:"Gospels",lv:1,k:["subj","pass","ellip"],la:"Dixit autem Maria: Ecce ancilla Domini, fiat mihi secundum verbum tuum.",dr:"And Mary said: Behold the handmaid of the Lord: be it done to me according to thy word.",p:[["dixit autem","autem here just moves the story on: \u201Cand\u201D."],["ecce ancilla","ecce \u201Cbehold\u201D; sum is understood."],["fiat","3rd sg. present subjunctive of fio, jussive: \u201Clet it be done\u201D."],["mihi","dative: \u201Cto me\u201D."],["secundum verbum tuum","secundum + accusative: \u201Caccording to\u201D."]],v:[["ancilla, -ae (f.)","handmaid, servant"],["fio, fieri, factus sum","to be done, become"],["secundum (+ acc.)","according to"]],t:"Fiat is the same form as in fiat lux (Genesis 1:3): \u201Clet it be\u201D."},{id:"lk2-7",ref:"Luke 2:7",g:"Gospels",lv:2,k:["perf","abl","dat"],la:"Et peperit filium suum primogenitum, et pannis eum involvit, et reclinavit eum in praesepio: quia non erat eis locus in diversorio.",dr:"And she brought forth her first born son and wrapped him up in swaddling clothes and laid him in a manger: because there was no room for them in the inn.",p:[["peperit","3rd sg. perfect of pario: \u201Cgave birth to\u201D."],["pannis","abl. pl. of pannus: ablative of means, \u201Cin (with) cloths\u201D."],["involvit, reclinavit","3rd sg. perfects."],["in praesepio","in + abl. of praesepium \u201Cmanger\u201D."],["non erat eis locus","dative of possession: \u201Cthey had no place\u201D, \u201Cthere was no room for them\u201D."]],v:[["pario, -ere, peperi","to bear, give birth"],["primogenitus, -a, -um","firstborn"],["pannus, -i (m.)","cloth"],["diversorium, -ii (n.)","inn, lodging"]],t:"esse + dative = \u201Cto have\u201D. Eis locus non erat = \u201Cthey had no room\u201D."},{id:"lk2-14",ref:"Luke 2:14",g:"Gospels",lv:1,k:["ellip","gen","dat","comp"],la:"Gloria in altissimis Deo, et in terra pax hominibus bonae voluntatis.",dr:"Glory to God in the highest; and on earth peace to men of good will.",p:[["gloria","nom. sg. (1st decl.); sit or est is understood."],["in altissimis","in + abl. pl. of the superlative altissimus: \u201Cin the highest (places)\u201D."],["Deo","dat. sg.: \u201Cto God\u201D."],["pax","nom. sg. of pax, pacis (f.)."],["hominibus","dat. pl. of homo, hominis."],["bonae voluntatis","genitive of quality describing hominibus: \u201Cof good will\u201D."]],v:[["altus, -a, -um","high"],["terra, -ae (f.)","earth"],["voluntas, -tatis (f.)","will, good pleasure"]],t:"A genitive of quality describes a noun the way an adjective would."},{id:"lk15-18",ref:"Luke 15:18",g:"Gospels",lv:1,k:["fut","perf"],la:"surgam, et ibo ad patrem meum, et dicam ei: Pater, peccavi in caelum, et coram te:",dr:"I will arise, and will go to my father, and say to him: Father, I have sinned against heaven, and before thee:",p:[["surgam, dicam","1st sg. futures of surgo and dico (3rd conj.)."],["ibo","1st sg. future of eo."],["ei","dat. sg. of is: \u201Cto him\u201D."],["peccavi","1st sg. perfect of pecco: \u201CI have sinned\u201D."],["in caelum","in + accusative: \u201Cagainst heaven\u201D."],["coram te","coram + ablative: \u201Cin the presence of\u201D."]],v:[["surgo, -ere","to rise"],["pecco, -are","to sin"],["coram (+ abl.)","before, in the presence of"]],t:"Surgam and dicam look like subjunctives. Next to the future ibo, they\u2019re clearly futures."},{id:"lk23-43",ref:"Luke 23:43",g:"Gospels",lv:1,k:["fut","dat","abl"],la:"Et dixit illi Iesus: Amen dico tibi: Hodie mecum eris in paradiso.",dr:"And Jesus said to him: Amen I say to thee, this day thou shalt be with me in paradise.",p:[["dixit illi","dative: \u201Csaid to him\u201D."],["amen","Hebrew loanword, indeclinable: \u201Ctruly\u201D."],["mecum","cum + me, with cum as an enclitic."],["eris","2nd sg. future of sum."],["in paradiso","in + abl."]],v:[["hodie (adv.)","today"],["paradisus, -i (m.)","paradise"]],t:"Know the future of sum by heart: ero, eris, erit, erimus, eritis, erunt."},{id:"jn1-1",ref:"John 1:1",g:"Gospels",lv:1,k:["order","abl"],la:"In principio erat Verbum, et Verbum erat apud Deum, et Deus erat Verbum.",dr:"In the beginning was the Word, and the Word was with God, and the Word was God.",p:[["in principio","in + ablative: point in time, \u201Cin the beginning\u201D."],["erat","3rd sg. imperfect indicative of sum: ongoing past, \u201Cwas\u201D."],["apud Deum","apud + accusative: \u201Cwith, in the presence of\u201D."],["Deus erat Verbum","Two nominatives with sum. Deus is the predicate, fronted for emphasis; Verbum stays the subject."]],v:[["principium, -ii (n.)","beginning"],["verbum, -i (n.)","word"],["apud (+ acc.)","with, at the side of"]],t:"With sum, decide which nominative is the subject by asking what the sentence is about."},{id:"jn1-5",ref:"John 1:5",g:"Gospels",lv:1,k:["perf","abl"],la:"et lux in tenebris lucet, et tenebrae eam non comprehenderunt.",dr:"And the light shineth in darkness, and the darkness did not comprehend it.",p:[["lux","nom. sg. of lux, lucis (f.)."],["in tenebris","in + abl. pl. Tenebrae is plural in form, singular in meaning."],["lucet","3rd sg. present of luceo."],["comprehenderunt","3rd pl. perfect of comprehendo: \u201Cgrasp, overcome, understand\u201D."],["eam","acc. sg. fem.; points back to lux."]],v:[["lux, lucis (f.)","light"],["tenebrae, -arum (f. pl.)","darkness"],["comprehendo, -ere","to seize, grasp"]],t:"Track pronoun gender: eam is feminine, so it refers to lux, not to the plural tenebrae."},{id:"jn1-14",ref:"John 1:14",g:"Gospels",lv:3,k:["pass","perf","gen","order"],la:"Et Verbum caro factum est, et habitavit in nobis: et vidimus gloriam eius, gloriam quasi Unigeniti a Patre plenum gratiae et veritatis.",dr:"And the Word was made flesh, and dwelt among us, (and we saw his glory, the glory as it were of the only begotten of the Father,) full of grace and truth.",p:[["caro factum est","perfect of fio \u201Cbecame\u201D, neuter to agree with Verbum; caro is predicate nominative."],["habitavit in nobis","3rd sg. perfect of habito; in nobis = \u201Camong us\u201D."],["vidimus","1st pl. perfect of video."],["quasi Unigeniti a Patre","genitive: \u201Cas of the Only-begotten from the Father\u201D; a + ablative."],["plenum gratiae et veritatis","plenus + genitive. The agreement is loose (Greek pl\u0113r\u0113s is often indeclinable); it describes the Word."]],v:[["caro, carnis (f.)","flesh"],["fio, fieri, factus sum","to become, be made"],["habito, -are","to dwell"],["quasi","as, as it were"]],t:"The Douay-Rheims brackets the middle clause as a parenthesis, so plenum attaches back to Verbum."},{id:"jn3-16",ref:"John 3:16",g:"Gospels",lv:2,k:["subj","perf","rel"],la:"Sic enim Deus dilexit mundum, ut Filium suum unigenitum daret: ut omnis qui credit in eum, non pereat, sed habeat vitam aeternam.",dr:"For God so loved the world, as to give his only begotten Son; that whosoever believeth in him, may not perish, but may have life everlasting.",p:[["sic \u2026 ut daret","result clause: sic signals ut + subjunctive. Daret is imperfect subj. of do, following the perfect dilexit."],["dilexit","3rd sg. perfect of diligo."],["ut \u2026 non pereat, sed habeat","purpose clause in the present subjunctive. Non (not ne) because it contrasts directly with sed."],["credit in eum","credo in + accusative: the Christian Latin idiom \u201Cbelieve in\u201D."],["vitam aeternam","acc. sg., object of habeat."]],v:[["diligo, -ere, dilexi","to love"],["unigenitus, -a, -um","only-begotten"],["pereo, -ire","to perish"]],t:"Two ut clauses in one verse: the first follows sic (result), the second states the aim (purpose)."},{id:"jn6-35",ref:"John 6:35",g:"Gospels",lv:1,k:["fut","rel"],la:"Dixit autem eis Iesus: Ego sum panis vitae: qui venit ad me, non esuriet: et qui credit in me, non sitiet umquam.",dr:"And Jesus said to them: I am the bread of life: he that cometh to me shall not hunger: and he that believeth in me shall never thirst.",p:[["panis vitae","predicate nominative + genitive."],["qui venit ad me","relative clause with no antecedent: \u201Che who comes\u201D."],["esuriet","3rd sg. future of esurio (4th conj.)."],["sitiet","3rd sg. future of sitio (4th conj.)."],["non \u2026 umquam","together: \u201Cnever\u201D."]],v:[["esurio, -ire","to hunger"],["sitio, -ire","to thirst"],["umquam (adv.)","ever"]],t:"4th conjugation futures use -ie-: veniet, esuriet, sitiet."},{id:"jn8-32",ref:"John 8:32",g:"Gospels",lv:1,k:["fut"],la:"Et cognoscetis veritatem, et veritas liberabit vos.",dr:"And you shall know the truth, and the truth shall make you free.",p:[["cognoscetis","2nd pl. future of cognosco (3rd conj.)."],["veritatem","acc. sg. of veritas, object."],["liberabit","3rd sg. future of libero (1st conj., -bi-)."],["vos","acc. pl., object of liberabit."]],v:[["cognosco, -ere","to come to know, learn"],["libero, -are","to set free"]],t:"Two futures, two conjugations: -etis (3rd) and -bit (1st)."},{id:"jn10-11",ref:"John 10:11",g:"Gospels",lv:1,k:["abl","order"],la:"Ego sum pastor bonus. Bonus pastor animam suam dat pro ovibus suis.",dr:"I am the good shepherd. The good shepherd giveth his life for his sheep.",p:[["pastor bonus / bonus pastor","the adjective moves before the noun the second time, for emphasis."],["animam suam","suam is reflexive: it refers to the subject, the shepherd."],["dat","3rd sg. present of do."],["pro ovibus suis","pro + abl. pl. of ovis, ovis (f.) \u201Csheep\u201D."]],v:[["pastor, -oris (m.)","shepherd"],["anima, -ae (f.)","soul, life"],["ovis, -is (f.)","sheep"]],t:"Anima often means \u201Clife\u201D as well as \u201Csoul\u201D. The Douay-Rheims chooses \u201Clife\u201D here."},{id:"jn11-25",ref:"John 11:25",g:"Gospels",lv:2,k:["fut","perf","rel","dep"],la:"Dixit ei Iesus: Ego sum resurrectio, et vita: qui credit in me, etiam si mortuus fuerit, vivet:",dr:"Jesus said to her: I am the resurrection and the life: he that believeth in me, although he be dead, shall live:",p:[["dixit ei","ei is dative of any gender. Context (Martha) makes it \u201Cto her\u201D."],["qui credit in me","relative clause with no antecedent: \u201Che who believes\u201D."],["etiam si","\u201Ceven if\u201D."],["mortuus fuerit","future perfect of the deponent morior: \u201Cshall have died\u201D."],["vivet","3rd sg. future of vivo."]],v:[["resurrectio, -onis (f.)","resurrection"],["morior, mori, mortuus","to die"],["etiam si","even if"]],t:"Latin uses the future perfect for an action finished before another future one. English often uses a present."},{id:"jn11-35",ref:"John 11:35",g:"Gospels",lv:1,k:["dep","perf"],la:"Et lacrimatus est Iesus.",dr:"And Jesus wept.",p:[["lacrimatus est","3rd sg. perfect of the deponent lacrimor: passive form, active meaning."],["Iesus","nominative subject, placed after the verb."]],v:[["lacrimor, -ari, lacrimatus sum","to weep, shed tears"]],t:"A good warm-up: spot the deponent and translate it actively."},{id:"jn13-34",ref:"John 13:34",g:"Gospels",lv:2,k:["subj","dat","perf"],la:"Mandatum novum do vobis: Ut diligatis invicem, sicut dilexi vos, ut et vos diligatis invicem.",dr:"A new commandment I give unto you: That you love one another, as I have loved you, that you also love one another.",p:[["mandatum novum","acc. object, placed first for emphasis."],["do vobis","dat. pl.: \u201Cto you\u201D."],["ut diligatis","substantive ut clause spelling out the commandment: \u201Cthat you love\u201D."],["invicem","\u201Cone another\u201D."],["dilexi","1st sg. perfect of diligo."],["ut et vos","et = \u201Calso\u201D here."]],v:[["mandatum, -i (n.)","commandment"],["invicem (adv.)","mutually, one another"],["sicut","just as"]],t:"An ut clause can be the content of a noun (command, request): translate \u201Cthat\u2026\u201D, not \u201Cso that\u2026\u201D."},{id:"jn14-6",ref:"John 14:6",g:"Gospels",lv:1,k:["order","dat"],la:"Dicit ei Iesus: Ego sum via, et veritas, et vita. Nemo venit ad Patrem, nisi per me.",dr:"Jesus saith to him: I am the way, and the truth, and the life. No man cometh to the Father, but by me.",p:[["dicit","historical present, 3rd sg. of dico."],["ei","dat. sg. of is: \u201Cto him\u201D."],["ego sum","the pronoun is emphatic; sum alone would mean \u201CI am\u201D."],["via, veritas, vita","three predicate nominatives."],["nisi per me","nisi \u201Cexcept\u201D + per + accusative."]],v:[["via, -ae (f.)","way, road"],["veritas, -tatis (f.)","truth"],["nemo","no one"],["nisi","unless, except"]],t:"Latin drops subject pronouns. When ego appears, it carries emphasis."},{id:"jn15-13",ref:"John 15:13",g:"Gospels",lv:3,k:["comp","abl","subj"],la:"Maiorem hac dilectionem nemo habet, ut animam suam ponat quis pro amicis suis.",dr:"Greater love than this no man hath, that a man lay down his life for his friends.",p:[["maiorem","acc. sg. fem. comparative of magnus, agreeing with dilectionem."],["hac","ablative of comparison: \u201Cthan this\u201D."],["ut \u2026 ponat","ut + subjunctive explaining hac: \u201C(namely) that someone lay down\u201D."],["quis","indefinite \u201Canyone\u201D, as after si, nisi, ne, num."],["animam ponere","idiom: \u201Clay down one\u2019s life\u201D."]],v:[["maior, maius","greater"],["dilectio, -onis (f.)","love"],["pono, -ere","to put, lay down"],["amicus, -i (m.)","friend"]],t:"An ablative right after a comparative often means \u201Cthan\u201D: maior hac = greater than this."},{id:"jn20-29",ref:"John 20:29",g:"Gospels",lv:2,k:["perf","rel","ellip"],la:"Dixit ei Iesus: Quia vidisti me, Thoma, credidisti: beati qui non viderunt, et crediderunt.",dr:"Jesus saith to him: Because thou hast seen me, Thomas, thou hast believed: blessed are they that have not seen, and have believed.",p:[["quia","\u201Cbecause\u201D."],["vidisti, credidisti","2nd sg. perfects of video and credo."],["Thoma","vocative of Thomas."],["beati qui","sunt and an antecedent are omitted: \u201Cblessed (are those) who\u201D."],["viderunt, crediderunt","3rd pl. perfects."]],v:[["video, -ere, vidi","to see"],["credo, -ere, credidi","to believe"]],t:"Perfect endings: -i, -isti, -it, -imus, -istis, -erunt."},{id:"ac1-8",ref:"Acts 1:8",g:"Acts & Epistles",lv:3,k:["fut","part","dat","gen"],la:"sed accipietis virtutem supervenientis Spiritus Sancti in vos, et eritis mihi testes in Ierusalem, et in omni Iudaea, et Samaria, et usque ad ultimum terrae.",dr:"But you shall receive the power of the Holy Ghost coming upon you, and you shall be witnesses unto me in Jerusalem, and in all Judea, and Samaria, and even to the uttermost part of the earth.",p:[["accipietis","2nd pl. future of accipio (3rd -io)."],["supervenientis Spiritus Sancti","genitive present participle agreeing with Spiritus: \u201Cof the Holy Spirit coming upon\u201D."],["in vos","in + accusative: \u201Cupon you\u201D."],["eritis mihi testes","dative of reference: \u201Cwitnesses for me\u201D."],["usque ad ultimum terrae","neuter adjective as noun + partitive genitive: \u201Cto the farthest part of the earth\u201D."]],v:[["virtus, -tutis (f.)","power, strength"],["supervenio, -ire","to come upon"],["testis, -is (m.)","witness"],["usque ad","as far as"]],t:"Find the noun a participle agrees with before translating it: supervenientis matches Spiritus, not virtutem."},{id:"ac2-38",ref:"Acts 2:38",g:"Acts & Epistles",lv:3,k:["imp","subj","gen","pass"],la:"Petrus vero ad illos: Poenitentiam, inquit, agite, et baptizetur unusquisque vestrum in nomine Iesu Christi in remissionem peccatorum vestrorum: et accipietis donum Spiritus Sancti.",dr:"But Peter said to them: Do penance, and be baptized every one of you in the name of Jesus Christ, for the remission of your sins: and you shall receive the gift of the Holy Ghost.",p:[["Petrus vero ad illos","verb of saying held back until inquit."],["inquit","\u201Che says/said\u201D, always set inside the quotation."],["poenitentiam agite","2nd pl. imperative of ago: \u201Cdo penance\u201D."],["baptizetur","3rd sg. present passive subjunctive, jussive: \u201Clet each be baptized\u201D."],["unusquisque vestrum","partitive genitive: \u201Ceach one of you\u201D."],["in remissionem","in + accusative of purpose: \u201Cfor the remission\u201D."]],v:[["poenitentia, -ae (f.)","repentance, penance"],["unusquisque","each one"],["remissio, -onis (f.)","forgiveness"],["donum, -i (n.)","gift"]],t:"Inquit interrupts a quotation. Move it to the front in English: \u201CPeter said: \u2026\u201D."},{id:"rm1-16",ref:"Romans 1:16",g:"Acts & Epistles",lv:2,k:["dat","part","ellip"],la:"Non enim erubesco Evangelium. Virtus enim Dei est in salutem omni credenti, Iudaeo primum, et Graeco.",dr:"For I am not ashamed of the gospel. For it is the power of God unto salvation to every one that believeth, to the Jew first, and to the Greek.",p:[["erubesco","1st sg. present, \u201CI blush at, am ashamed of\u201D, with an accusative object."],["virtus Dei est","the subject (the gospel) is understood."],["in salutem","in + accusative of purpose: \u201Cunto salvation\u201D."],["omni credenti","dative of the present participle credens, used as a noun: \u201Cto everyone believing\u201D."],["Iudaeo, Graeco","datives in apposition to credenti."]],v:[["erubesco, -ere","to blush, be ashamed of"],["salus, -utis (f.)","salvation, health"],["primum (adv.)","first"]],t:"A participle with no noun often means \u201Cthe one who\u2026\u201D: credenti = \u201Cto the one who believes\u201D."},{id:"rm5-8",ref:"Romans 5:8\u20139a",g:"Acts & Epistles",lv:3,k:["subj","dep","perf"],la:"Commendat autem caritatem suam Deus in nobis: quoniam cum adhuc peccatores essemus, secundum tempus Christus pro nobis mortuus est:",dr:"But God commendeth his charity towards us: because when as yet we were sinners according to the time, Christ died for us;",p:[["commendat","3rd sg. present of commendo: \u201Cshows, proves\u201D."],["in nobis","\u201Ctowards us\u201D."],["cum \u2026 essemus","cum + imperfect subjunctive, circumstantial: \u201Cwhen we were\u201D."],["secundum tempus","\u201Cat the appointed time\u201D."],["mortuus est","perfect of the deponent morior: \u201Cdied\u201D."]],v:[["commendo, -are","to commend, prove"],["adhuc (adv.)","still, as yet"],["peccator, -oris (m.)","sinner"]],t:"cum + subjunctive is usually \u201Cwhen\u201D, \u201Csince\u201D or \u201Calthough\u201D. Read the main clause to decide."},{id:"rm6-23",ref:"Romans 6:23",g:"Acts & Epistles",lv:2,k:["ellip","gen","abl"],la:"Stipendia enim peccati, mors. Gratia autem Dei, vita aeterna, in Christo Iesu Domino nostro.",dr:"For the wages of sin is death. But the grace of God, life everlasting, in Christ Jesus our Lord.",p:[["stipendia","nom. pl. neut. of stipendium: \u201Cwages\u201D. The verb is omitted."],["peccati","gen. sg. of peccatum."],["mors","predicate nominative."],["gratia autem Dei","nominative + genitive. Autem marks the contrast: \u201Cbut\u201D."],["in Christo Iesu Domino nostro","in + ablative, with Domino nostro in apposition."]],v:[["stipendium, -ii (n.)","pay, wages"],["peccatum, -i (n.)","sin"],["mors, mortis (f.)","death"]],t:"Paul drops est twice. English needs it supplied."},{id:"rm8-31",ref:"Romans 8:31",g:"Acts & Epistles",lv:1,k:["fut","ellip"],la:"Quid ergo dicemus ad haec? si Deus pro nobis, quis contra nos?",dr:"What shall we then say to these things? If God be for us, who is against us?",p:[["quid","acc. sg. neut. interrogative, object of dicemus."],["dicemus","1st pl. future of dico, -ere. In the 3rd conjugation, -emus marks the future."],["ad haec","ad + acc. neut. pl. of hic: \u201Cto these things\u201D."],["pro nobis","pro + ablative: \u201Cfor, on behalf of\u201D. Est is omitted."],["contra nos","contra + accusative: \u201Cagainst\u201D."]],v:[["ergo","therefore, then"],["pro (+ abl.)","for, on behalf of"],["contra (+ acc.)","against"]],t:"Don\u2019t read dicemus as a present. Compare dicimus (we say) with dicemus (we shall say)."},{id:"1co13-4",ref:"1 Corinthians 13:4",g:"Acts & Epistles",lv:2,k:["dep","pass","part"],la:"Caritas patiens est, benigna est. Caritas non aemulatur, non agit perperam, non inflatur.",dr:"Charity is patient, is kind: charity envieth not, dealeth not perversely; is not puffed up;",p:[["patiens est","present participle of the deponent patior, used as a predicate adjective."],["benigna","nom. sg. fem. adjective agreeing with caritas."],["aemulatur","3rd sg. present of the deponent aemulor: passive form, active meaning, \u201Cenvies\u201D."],["agit perperam","ago + the adverb perperam: \u201Cacts wrongly\u201D."],["inflatur","3rd sg. present passive of inflo: \u201Cis puffed up\u201D."]],v:[["caritas, -tatis (f.)","love, charity"],["benignus, -a, -um","kind"],["aemulor, -ari (dep.)","to envy"],["perperam (adv.)","wrongly"]],t:"Deponent verbs look passive but translate actively. Inflatur is a true passive."},{id:"1co13-13",ref:"1 Corinthians 13:13",g:"Acts & Epistles",lv:2,k:["comp","gen","order"],la:"Nunc autem manent fides, spes, caritas, tria haec: maior autem horum est caritas.",dr:"And now there remain faith, hope, and charity, these three: but the greatest of these is charity.",p:[["manent","3rd pl. present of maneo; its three subjects follow it."],["tria haec","neuter plural summing up the three nouns: \u201Cthese three (things)\u201D."],["maior","comparative of magnus, where English might expect \u201Cgreatest\u201D."],["horum","partitive genitive of hic: \u201Cof these\u201D."]],v:[["maneo, -ere","to remain"],["spes, spei (f.)","hope"],["tres, tria","three"]],t:"Latin can use the comparative maior even when picking one out of three. English says \u201Cthe greatest\u201D, as the Douay-Rheims does."},{id:"2co5-17",ref:"2 Corinthians 5:17",g:"Acts & Epistles",lv:3,k:["ellip","perf","pass"],la:"Si qua ergo in Christo nova creatura, vetera transierunt, ecce facta sunt omnia nova.",dr:"If then any be in Christ a new creature, the old things are passed away, behold all things are made new.",p:[["si qua","qua = aliqua, the indefinite after si; est is omitted: \u201Cif there is any new creature\u201D."],["vetera","neut. pl. of vetus, used as a noun: \u201Cthe old things\u201D."],["transierunt","3rd pl. perfect of transeo: \u201Chave passed away\u201D."],["facta sunt","perfect of fio: \u201Chave become, are made\u201D."],["omnia nova","subject + predicate adjective."]],v:[["creatura, -ae (f.)","creature, creation"],["vetus, veteris","old"],["transeo, -ire","to pass over, pass away"]],t:"After si, nisi, num, ne, drop the ali- from aliquis: si quis, si qua, si quid."},{id:"eph2-8",ref:"Ephesians 2:8",g:"Acts & Epistles",lv:2,k:["abl","pass","perf","gen"],la:"Gratia enim estis salvati per fidem, et hoc non ex vobis: Dei enim donum est:",dr:"For by grace you are saved through faith, and that not of yourselves, for it is the gift of God;",p:[["gratia","ablative of means: \u201Cby grace\u201D."],["estis salvati","2nd pl. perfect passive of salvo: \u201Cyou have been saved\u201D."],["per fidem","per + accusative: \u201Cthrough\u201D."],["hoc non ex vobis","est is omitted."],["Dei donum est","genitive + predicate nominative."]],v:[["salvo, -are","to save"],["fides, -ei (f.)","faith"],["donum, -i (n.)","gift"]],t:"Without macrons, -a can be nominative or ablative. Here the sentence already has a subject (you), so gratia is ablative."},{id:"ph2-8",ref:"Philippians 2:8",g:"Acts & Epistles",lv:2,k:["part","pass","gen"],la:"humiliavit semetipsum factus obediens usque ad mortem, mortem autem crucis.",dr:"He humbled himself, becoming obedient unto death, even to the death of the cross.",p:[["humiliavit","3rd sg. perfect of humilio."],["semetipsum","emphatic reflexive (se + -met + ipsum): \u201Chimself\u201D."],["factus","perfect participle of fio: \u201Chaving become\u201D."],["obediens","present participle used as an adjective: \u201Cobedient\u201D."],["mortem autem crucis","repeated for emphasis; crucis is genitive of crux."]],v:[["humilio, -are","to humble"],["obediens, -entis","obedient"],["crux, crucis (f.)","cross"]],t:"Factus works like an English participle: \u201Chaving become\u201D, or simply \u201Cbecoming\u201D."},{id:"ph4-13",ref:"Philippians 4:13",g:"Acts & Epistles",lv:1,k:["rel","abl"],la:"Omnia possum in eo qui me confortat.",dr:"I can do all things in him who strengtheneth me.",p:[["omnia","acc. pl. neut.: \u201Call things\u201D."],["possum","1st sg. present of possum (pot- + sum)."],["in eo","in + abl. sg. of is: \u201Cin him\u201D."],["confortat","3rd sg. present of conforto, a Late Latin verb, \u201Cstrengthen\u201D."]],v:[["possum, posse","to be able"],["conforto, -are","to strengthen"]],t:"Possum takes omnia as its object, with \u201Cdo\u201D understood: \u201CI can (do) all things\u201D."},{id:"ga2-20",ref:"Galatians 2:20a",g:"Acts & Epistles",lv:1,k:["ellip","order"],la:"Vivo autem, iam non ego: vivit vero in me Christus.",dr:"And I live, now not I; but Christ liveth in me.",p:[["vivo","1st sg. present of vivo."],["iam non ego","\u201Cno longer I\u201D; vivo is understood again."],["vero","\u201Cbut, in truth\u201D."],["vivit \u2026 Christus","the subject comes last, after the prepositional phrase."]],v:[["vivo, -ere","to live"],["iam non","no longer"],["vero","but, indeed"]],t:"The first half of the verse only. Ego is stated just to be denied."},{id:"hb11-1",ref:"Hebrews 11:1",g:"Acts & Epistles",lv:3,k:["part","gen","order"],la:"Est autem fides sperandarum substantia rerum, argumentum non apparentium.",dr:"Now faith is the substance of things to be hoped for, the evidence of things that appear not.",p:[["autem","postpositive conjunction: \u201Cnow, moreover\u201D."],["sperandarum \u2026 rerum","gerundive, gen. pl. fem., split from its noun (hyperbaton): \u201Cof things to be hoped for\u201D."],["substantia, argumentum","predicate nominatives after est."],["non apparentium","gen. pl. present participle of appareo, used as a noun: \u201Cof things not appearing\u201D."]],v:[["spero, -are","to hope"],["substantia, -ae (f.)","substance, foundation"],["argumentum, -i (n.)","proof, evidence"],["appareo, -ere","to appear"]],t:"Match endings across the gap: sperandarum looks for a fem. gen. pl. noun, and finds rerum."},{id:"hb13-8",ref:"Hebrews 13:8",g:"Acts & Epistles",lv:1,k:["ellip"],la:"Iesus Christus heri, et hodie: ipse et in saecula.",dr:"Jesus Christ, yesterday, and today: and the same for ever.",p:[["(no verb)","supply est: \u201Cis (the same)\u201D."],["heri, hodie","adverbs of time."],["ipse","\u201Cthe same\u201D."],["in saecula","literally \u201Cinto the ages\u201D: \u201Cfor ever\u201D."]],v:[["heri (adv.)","yesterday"],["saeculum, -i (n.)","age, generation"]],t:"With no verb at all, decide what the sentence asserts and supply \u201Cis\u201D."},{id:"jas2-26",ref:"James 2:26",g:"Acts & Epistles",lv:2,k:["abl","comp"],la:"Sicut enim corpus sine spiritu mortuum est, ita et fides sine operibus mortua est.",dr:"For even as the body without the spirit is dead; le bg-paper px-2 py-0.5 text-ink hover:border-soft"},React.createElement("span",{lang:"la",className:"latin"},b)))),m&&React.createElement(EntryView,{key:m.it.lemma+(m.form||""),it:m.it,form:m.form,onDrill:b=>{u({...b,at:Date.now()}),c("drill")}})):React.createElement(Trainer,{index:d,prog:e,onAnswer:t,openTable:y,preset:f}))}const GUIDE={grammar:[{group:"Cases",items:[{id:"absl",title:"Ablative absolute",concept:"absl",rule:"A noun or pronoun and a participle, both ablative, standing apart from the grammar of the main clause. It sets the scene: time, cause, condition or concession.",how:"Make it a clause: \u201Cwhen\u2026\u201D, \u201Cafter\u2026\u201D, \u201Csince\u2026\u201D, \u201Calthough\u2026\u201D. A present participle happens at the same time as the main verb; a perfect participle, before it.",ask:"\u201CWhat construction is ascendente eo?\u201D Ablative absolute: eo is ablative of is, ascendente the present participle agreeing with it.",ex:[{la:"Et ascendente eo in naviculam, secuti sunt eum discipuli ejus",en:"And when he entered into the boat, his disciples followed him.",at:["mt",8,23]}]},{id:"abl",title:"Ablative: means, agent, time, comparison",concept:"abl",rule:"The Vulgate keeps the classical uses but adds two of its own: in + ablative for the instrument (from Greek and Hebrew), and the ablative for duration of time, where classical Latin uses the accusative.",how:"Agent (a/ab + person) \u201Cby\u201D; means (thing, often in + ablative) \u201Cwith, by means of\u201D; time \u201Cfor, during, at\u201D; comparison \u201Cthan\u201D.",ask:"\u201CWhy a Spiritu but in gladio?\u201D A person is the agent (a/ab); a thing is the means, and the Vulgate often puts in before it.",ex:[{la:"ut tentaretur a diabolo",en:"to be tempted by the devil (agent).",at:["mt",4,1]},{la:"percutimus in gladio",en:"(Lord,) shall we strike with the sword? (in + ablative of means)",at:["lk",22,49]},{la:"quadraginta diebus et quadraginta noctibus",en:"(when he had fasted) forty days and forty nights (duration, in the ablative).",at:["mt",4,2]},{la:"Pater major me est",en:"The Father is greater than I (ablative of comparison).",at:["jn",14,28]}]},{id:"dat",title:"Dative: possession, reference, advantage",concept:"dat",rule:"Besides the indirect object, the dative marks the owner with esse (\u201Cthere is to him\u201D = \u201Che has\u201D) and the person for whom something is so.",how:"Possession: turn it round: cui nomen erat \u201Cwhose name was\u201D. Reference: \u201Cto me\u201D, \u201Cin my eyes\u201D, \u201Cfor me\u201D.",ask:"\u201CWhat case is cui, and why?\u201D Dative of possession with erat.",ex:[{la:"Fuit homo missus a Deo, cui nomen erat Joannes",en:"There was a man sent from God, whose name was John.",at:["jn",1,6]},{la:"vas electionis est mihi iste",en:"this man is to me a vessel of election (dative of reference; electionis, genitive of quality).",at:["ac",9,15]}]},{id:"gen",title:"Genitive: quality, the Hebrew superlative, object",concept:"gen",rule:"Biblical Latin uses a genitive where English uses an adjective (a Hebraism), and doubles a noun with its own genitive plural for a superlative.",how:"villicus iniquitatis \u201Cthe unjust steward\u201D; in saecula saeculorum \u201Cfor ever and ever\u201D; timor Domini \u201Cfear of the Lord\u201D (objective: the Lord is feared).",ask:"\u201CWhat kind of genitive is iniquitatis?\u201D Genitive of quality (description), the Hebrew way of saying \u201Cunjust\u201D.",ex:[{la:"Et laudavit dominus villicum iniquitatis",en:"And the lord commended the unjust steward.",at:["lk",16,8]},{la:"in saecula saeculorum",en:"for ever and ever.",at:["ap",1,6]},{la:"Liber generationis Jesu Christi filii David, filii Abraham",en:"The book of the generation of Jesus Christ, the son of David, the son of Abraham. (Jesu is genitive; David and Abraham don\u2019t decline.)",at:["mt",1,1]}]}]},{group:"Verbs and clauses",items:[{id:"ind",title:"Indirect statement: accusative and infinitive, or quod / quia",concept:"ind",rule:"Classical Latin reports speech and thought with an accusative subject and an infinitive. Church Latin often uses quod, quia or quoniam with a finite verb instead, as Greek does with \u1F45\u03C4\u03B9.",how:"Accusative + infinitive: \u201Cthat X is\u2026\u201D. After a verb of saying, quia usually means \u201Cthat\u201D, not \u201Cbecause\u201D.",ask:"\u201CWhy esse?\u201D Infinitive of indirect statement after dicunt: Filium hominis is its accusative subject, quem the accusative complement.",ex:[{la:"Quem dicunt homines esse Filium hominis?",en:"Whom do men say that the Son of man is?",at:["mt",16,13]},{la:"Initium esse sapientiae timorem Domini, dicit propheta.",en:"The prophet says that the fear of the Lord is the beginning of wisdom. (St Ambrose: the infinitive clause comes first.)",at:["se1",1,1]},{la:"Dico enim vobis, quia nisi abundaverit",en:"For I tell you that unless (your justice) abound\u2026 (quia = \u201Cthat\u201D).",at:["mt",5,20]}]},{id:"purp",title:"Purpose: ut / ne, and the infinitive of purpose",concept:"subj",rule:"Purpose is ut (negative ne) with the subjunctive. After verbs of motion the Vulgate also uses a plain infinitive, following the Greek.",how:"\u201Cso that\u2026\u201D, \u201Cin order to\u2026\u201D, \u201Cthat\u2026 may\u201D; ne \u201Clest\u201D, \u201Cso that\u2026 not\u201D.",ask:"\u201CWhy pereat?\u201D Present subjunctive in a purpose clause. The Vulgate writes ut\u2026 non where classical Latin would use ne.",ex:[{la:"ut omnis qui credit in eum, non pereat",en:"that whosoever believeth in him may not perish.",at:["jn",3,16]},{la:"venimus adorare eum",en:"we are come to adore him (infinitive of purpose).",at:["mt",2,2]},{la:"ut mitteret eos praedicare",en:"that he might send them to preach (both at once).",at:["mk",3,14]}]},{id:"res",title:"Result: ita / tam / sic \u2026 ut",concept:"subj",rule:"Result is ut with the subjunctive, usually signposted by ita, tam, sic, tantus or talis. Its negative is ut non; in classical Latin a negative purpose uses ne instead.",how:"\u201Cso (that)\u2026\u201D, \u201Cwith the result that\u2026\u201D.",ask:"\u201CPurpose or result?\u201D Result: ita points to it, and a negative result would be ut non, not ne.",ex:[{la:"ita ut nemo posset transire",en:"so that no man could pass (by that way).",at:["mt",8,28]}]},{id:"cum",title:"Cum clauses and the connecting relative",concept:"subj",rule:"Cum with the subjunctive means when, since or although; with the indicative, simply when. A relative pronoun opening a sentence often stands for \u201Cand he / and they\u201D (the connecting relative).",how:"Cum natus esset \u201Cwhen he was born\u201D; Qui cum audissent \u201Cand when they had heard\u201D (qui = et illi).",ask:"\u201CWhat is qui here?\u201D A connecting relative, nominative plural, standing for et illi.",ex:[{la:"Cum ergo natus esset Jesus",en:"When Jesus therefore was born\u2026",at:["mt",2,1]},{la:"Qui cum audissent regem",en:"And when they had heard the king (they went their way).",at:["mt",2,9]}]},{id:"iq",title:"Indirect questions",concept:"subj",rule:"A question reported after a verb of asking, knowing or saying puts its verb in the subjunctive, with the tense set by the main verb (sequence of tenses).",how:"Translate as an ordinary English reported question: \u201Cwhere Christ would be born\u201D. A future is shown with the -urus participle and sim / essem.",ask:"\u201CWhy nasceretur?\u201D Imperfect subjunctive in an indirect question after the past sciscitabatur.",ex:[{la:"ubi Christus nasceretur",en:"(he inquired of them) where Christ should be born.",at:["mt",2,4]},{la:"quid esset facturus",en:"(for he himself knew) what he would do.",at:["jn",6,6]}]},{id:"cond",title:"Conditions",concept:"subj",rule:"Indicative for real or future conditions; present subjunctive for \u201Cshould\u2026 would\u201D; imperfect subjunctive for unreal present, pluperfect for unreal past. In the Psalms, si can also introduce an oath: \u201C(may I perish) if\u2026\u201D, meaning \u201Csurely not\u201D.",how:"si fuisses\u2026 non fuisset \u201Cif you had been\u2026 would not have\u201D; Si introibunt \u201CThey shall not enter\u201D.",ask:"\u201CWhat kind of condition?\u201D Contrary to fact in past time: pluperfect subjunctive in both halves.",ex:[{la:"si fuisses hic, frater meus non fuisset mortuus",en:"(Lord,) if thou hadst been here, my brother had not died.",at:["jn",11,21]},{la:"Si introibunt in requiem meam",en:"They shall not enter into my rest (a Hebrew oath).",at:["ps",94,11]},{la:"Si Deus pro nobis, quis contra nos?",en:"If God be for us, who is against us? (est understood twice).",at:["rm",8,31]}]},{id:"jus",title:"Wishes and commands in the subjunctive",concept:"subj",rule:"A main-clause subjunctive can command, exhort or wish: jussive (3rd person \u201Clet it\u2026\u201D), hortatory (1st plural \u201Clet us\u2026\u201D), optative (\u201Cmay\u2026\u201D).",how:"Sanctificetur \u201Challowed be\u201D, Adveniat \u201C(thy kingdom) come\u201D, sit gloria \u201Cglory be\u201D.",ask:"\u201CWhy the subjunctive in Adveniat?\u201D Jussive (or optative): present subjunctive in a main clause expressing a wish.",ex:[{la:"Sanctificetur nomen tuum",en:"Hallowed be thy name.",at:["mt",6,9]},{la:"Adveniat regnum tuum",en:"Thy kingdom come.",at:["mt",6,10]},{la:"Deo Patri sit gloria",en:"To God the Father be glory (the usual doxology opening).",at:["hy",2,8]}]},{id:"gnd",title:"Gerund, gerundive and \u201Cdicendum\u201D",concept:"part",rule:"The gerund is a verbal noun (pariendi \u201Cof giving birth\u201D). The gerundive is a verbal adjective of necessity; with esse it says what must be done (passive periphrastic). St Thomas\u2019s Respondeo dicendum quod is this construction.",how:"tempus pariendi \u201Cthe time of giving birth\u201D; dicendum (est) \u201Cit must be said\u201D \u2192 simply \u201CI answer that\u2026\u201D.",ask:"\u201CParse dicendum.\u201D Gerundive, neuter nominative singular, with est understood: \u201Cit must be said\u201D.",ex:[{la:"impletum est tempus pariendi",en:"(Now Elizabeth\u2019s) full time of being delivered was come.",at:["lk",1,57]},{la:"Respondeo dicendum quod",en:"I answer that\u2026",at:["st1",1,4]}]},{id:"ptc",title:"Participles: translate them as clauses",concept:"part",rule:"A participle often carries a whole clause. The Vulgate uses present participles where Greek has aorists, so intrantes can mean \u201Chaving entered\u201D.",how:"Turn it into \u201Cwhen / as / after / because \u2026\u201D or a second main verb: \u201Cthey entered the house and found\u2026\u201D.",ask:"\u201CWhat tense is intrantes, and how do you translate it?\u201D Present participle, nominative plural; here \u201Cwhen they had entered\u201D.",ex:[{la:"intrantes domum, invenerunt puerum",en:"entering into the house, they found the child.",at:["mt",2,11]}]},{id:"comp",title:"Comparison",concept:"comp",rule:"The comparative takes quam (than) or the ablative of comparison. Plus can stand as a noun: \u201Csomething greater\u201D.",how:"major me \u201Cgreater than I\u201D; prudentiores filiis lucis \u201Cwiser than the children of light\u201D.",ask:"\u201CWhat case is filiis, and why?\u201D Ablative of comparison after prudentiores.",ex:[{la:"prudentiores filiis lucis",en:"wiser than the children of light.",at:["lk",16,8]},{la:"plus quam Jonas hic",en:"a greater than Jonas (is) here.",at:["mt",12,41]}]}]},{group:"Church Latin idioms",items:[{id:"factum",title:"\u201CFactum est\u201D and Hebrew parataxis",concept:"order",rule:"Factum est (et)\u2026 renders the Hebrew \u201Cand it came to pass\u201D. Biblical narrative strings clauses with et where classical Latin would subordinate.",how:"Douay keeps \u201Cit came to pass\u201D; a modern rendering may drop it. Let et be \u201Cand\u201D; don\u2019t force clauses into subordination.",ask:"\u201CHow would you render factum est here?\u201D \u201CIt came to pass that\u2026\u201D, or simply begin \u201CIn those days\u2026\u201D.",ex:[{la:"Factum est autem in diebus illis",en:"And it came to pass, that in those days\u2026",at:["lk",2,1]}]},{id:"amen",title:"Amen, ecce, and the missing est",concept:"ellip",rule:"Amen dico vobis is a solemn formula (Douay keeps \u201CAmen\u201D). Ecce points: \u201Cbehold\u201D. Est is often left out, as in Hebrew and Greek.",how:"Supply is / are where the sentence needs a verb.",ask:"\u201CWhy no verb?\u201D Ecce needs none. Elsewhere supply est, as in Si Deus pro nobis (est).",ex:[{la:"Amen quippe dico vobis",en:"For amen I say unto you.",at:["mt",5,18]},{la:"Ecce ancilla Domini",en:"Behold the handmaid of the Lord.",at:["lk",1,38]}]},{id:"names",title:"Jesus and the Hebrew names",concept:null,rule:"Jesus declines Jesus (nominative), Jesum (accusative), Jesu (genitive, dative, ablative, vocative). Many Hebrew names don\u2019t decline at all (David, Abraham, Israel); the case comes from the context. Jerusalem appears both indeclinable and as Hierosolyma (neuter plural).",how:"Read the case from prepositions, verbs and agreeing words, not from the name.",ask:"\u201CWhat case is Jesu?\u201D Look at the construction: here genitive with generationis.",ex:[{la:"Liber generationis Jesu Christi",en:"The book of the generation of Jesus Christ.",at:["mt",1,1]}]}]}],parts:[{id:"nt",title:"1. New Testament",lead:"The Clementine Vulgate: St Jerome\u2019s Latin, close to the Greek. Plain narrative and sayings, long letters of St Paul.",points:["Watch quia / quod after verbs of saying: usually \u201Cthat\u201D, not \u201Cbecause\u201D.","Present participles for Greek aorists (intrantes \u201Chaving entered\u201D); the infinitive of purpose (venimus adorare).","Greek words in Latin dress: baptizo, scandalizo, evangelizo, ecclesia, synagoga, pascha, parasceve, sabbatum, apostolus.","St Paul builds long sentences with participles and relatives: find each finite verb first, then hang the rest on it.","Hebrew names often don\u2019t decline; Jesus has Jesu in four cases."],ex:[{la:"In principio erat Verbum",en:"In the beginning was the Word.",at:["jn",1,1]}]},{id:"st",title:"2. Summa Theologiae",lead:"St Thomas writes clear, technical Latin in a fixed structure. Once you know the frame, most of an article is formula.",frame:[["Utrum\u2026","Whether\u2026","the article\u2019s question"],["Videtur quod\u2026","It seems that\u2026","Objection 1: the view St Thomas will answer"],["Praeterea\u2026","Further\u2026","Objections 2, 3\u2026"],["Sed contra est quod dicitur\u2026","On the contrary, it is said\u2026","an authority"],["Respondeo dicendum quod\u2026","I answer that\u2026","his own answer (the body)"],["Ad primum ergo dicendum quod\u2026","Reply to Objection 1\u2026","answers to each objection"],["Ad secundum dicendum quod\u2026","Reply to Objection 2\u2026",""]],points:["Connectives carry the argument: enim \u201Cfor\u201D, autem \u201Cbut, now\u201D, ergo / igitur \u201Ctherefore\u201D, unde \u201Chence\u201D, sicut \u201Cjust as\u201D, ut dictum est \u201Cas was said\u201D, ut patet \u201Cas is clear\u201D.","Technical vocabulary has fixed meanings: see Summa vocabulary.","Long quod clauses: Thomas nests \u201Cthat\u2026 which\u2026\u201D deeply. Bracket each quod clause as you go.","Impersonal passives: dicitur \u201Cit is said\u201D, ostensum est \u201Cit has been shown\u201D, considerandum est \u201Cwe must consider\u201D."],ex:[{la:"Videtur quod non sit necessarium, praeter philosophicas disciplinas, aliam doctrinam haberi",en:"It seems that, besides the philosophical disciplines, no further doctrine is required.",at:["st1",1,1]},{la:"Sed contra est quod dicitur",en:"On the contrary, it is said\u2026",at:["st1",1,3]}]},{id:"se",title:"3. Matins sermon",lead:"Lessons from the Fathers read at Matins: St Gregory, St Augustine, St Leo, St Ambrose, St Jerome, St Bede and others. Rhetorical, periodic Latin.",points:["On Sundays and feasts the third nocturn opens with the Gospel (Lectio sancti Evangelii secundum N. \u2026 In illo tempore \u2026 Et reliqua) and the Father\u2019s homily on it.","Expect rhetorical questions, antithesis, Scripture quoted mid-sentence, and the hortatory subjunctive (consideremus \u201Clet us consider\u201D).","The address fratres (carissimi) is a vocative: \u201Cbrethren\u201D.","Sentences are long but balanced: find the pairs (non solum\u2026 sed etiam; quanto\u2026 tanto)."],ex:[{la:"Quid est autem initium sapientiae, nisi saeculo renuntiare?",en:"But what is the beginning of wisdom, if not to renounce the world? (renuntiare: infinitive as a noun; saeculo dative.)",at:["se1",1,1]},{la:"Lectio sancti Evangelii, quae modo in auribus vestris lecta est, fratres mei",en:"The reading of the holy Gospel, which has just been read in your hearing, my brethren\u2026",at:["se5",4,1]}]},{id:"hy",title:"4. Office hymn",lead:"Short stanzas of verse, most in the four-line, eight-syllable stanza of St Ambrose. The texts follow the Roman Breviary.",points:["Word order serves the metre: an adjective may sit a line away from its noun. Match them by their endings.","Find the vocatives (whom the hymn addresses) and the imperatives or subjunctives (what it asks): da, praesta, adesto, sis.","A relative at the start of a stanza often refers back to the stanza before.","The last stanza is usually the doxology to the Trinity."],ex:[{la:"Te lucis ante terminum, / Rerum Creator, poscimus, / Ut pro tua clementia / Sis praesul et custodia.",en:"Before the ending of the light, Creator of all things, we ask thee that of thy clemency thou be our guardian and protector.",at:["hy",124,1]},{la:"Ave maris stella, / Dei Mater alma",en:"Hail, star of the sea, loving Mother of God. (All vocatives.)",at:["hy",20,1]}]},{id:"ps",title:"5. Psalm",lead:"The Gallican Psalter of the Vulgate, translated from the Greek Septuagint. Its numbering runs one behind the Hebrew for most psalms (Vulgate 22 is Hebrew 23).",points:["Parallelism: the second half of a verse restates or answers the first. If one half is clear, use
