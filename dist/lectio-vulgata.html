xB7 propter \xB7 secundum \xB7 supr\u0101 \xB7 tr\u0101ns \xB7 ultr\u0101 \xB7 versus",src:"Bennett \xA7 141; Allen & Greenough \xA7 220",url:"https://www.gutenberg.org/ebooks/15665"},{k:"Either",la:"in \xB7 sub (also, rarely, subter, super)",note:"With the accusative they mean motion (in urbem, into the city), with the ablative rest (in urbe, in the city).",src:"Bennett \xA7 143",url:"https://www.gutenberg.org/ebooks/15665"},{k:"Kennedy\u2019s rhyme: accusative",verse:["Ante, apud, ad, adversus,","Circum, circa, citra, cis,","Contra, inter, erga, extra,","Infra, intra, juxta, ob,","Penes, pone, post, and praeter,","Prope, propter, per, secundum,","Supra, versus, ultra, trans;","Add super, subter, sub and in,","When \u2018motion\u2019 \u2019tis, not \u2018state,\u2019 they mean."],src:"Kennedy, The Revised Latin Primer (12th impr., 1906), Appendix IV",url:"https://distantreader.org/stacks/trust/uc2/uc2_ark+=13960=t4mk6787g.txt"},{k:"Kennedy\u2019s rhyme: ablative",verse:["A, ab, absque, coram, de,","Palam, clam, cum, ex, and e,","Sine, tenus, pro, and prae:","Add super, subter, sub and in,","When \u2018state,\u2019 not \u2018motion,\u2019 \u2019tis they mean."],note:"Bradley\u2019s Latin version begins the same way: \u201CA, ab, absque, coram, de, / palam, clam, cum, ex, et e, / sine, tenus, pro, et prae\u201D.",src:"Kennedy, The Revised Latin Primer (12th impr., 1906), Appendix IV, List of Prepositions",url:"https://distantreader.org/stacks/trust/uc2/uc2_ark+=13960=t4mk6787g.txt"}]},{id:"kennedy",title:"Kennedy\u2019s Memorial Lines on Gender",items:[{k:"General rules",verse:["The Gender of a Latin Noun","by meaning, form, or use is shown.","","A Man, Month, Mountain, River, Wind,","and People Masculine we find:","  Romulus, October, Pindus, Padus, Eurus, Achivi.","","A Woman, Island, Country, Tree,","and City, Feminine we see:","  Penelope, Cyprus, Germania, laurus, Athenae.","","To Nouns that cannot be declined","the Neuter Gender is assigned:","Examples fas and nefas give","and the Verb-Noun Infinitive:","  Est summum nefas fallere:","  Deceit is gross impiety."],src:"Kennedy, The Revised Latin Primer (12th impr., 1906), Appendix IV",url:"https://distantreader.org/stacks/trust/uc2/uc2_ark+=13960=t4mk6787g.txt"},{k:"Common gender (either sex)",verse:["Common are: sacerdos, dux,","vates, parens et conjux,","civis, comes, custos, vindex,","adulescens, infans, index,","judex, testis, artifex,","praesul, exsul, opifex,","heres, miles, incola,","auctor, augur, advena,","hostis, obses, praeses, ales,","patruelis et satelles,","municeps et interpres,","juvenis et antistes,","auriga, princeps: add to these","bos, damma, talpa, serpens, sus,","camelus, canis, tigris, perdix, grus."],note:"priest (priestess), leader, seer, parent, spouse, citizen, companion, guard, avenger, youth, infant, informer, judge, witness, artist, director, exile, worker, heir, soldier, inhabitant, author, augur, newcomer, enemy, hostage, president, bird, cousin, attendant, burgess, interpreter, young person, overseer, charioteer, chief; ox (cow), deer, mole, serpent, swine, camel, dog, tiger, partridge, crane.",src:"Kennedy, The Revised Latin Primer (12th impr., 1906), Appendix IV",url:"https://distantreader.org/stacks/trust/uc2/uc2_ark+=13960=t4mk6787g.txt"},{k:"First declension",verse:["Feminine in First a, e,","Masculine as, es will be.","","Nouns denoting Males in a","are by meaning Mascula:","and Masculine is found to be","Hadria, the Adriatic Sea."],src:"Kennedy, The Revised Latin Primer (12th impr., 1906), Appendix IV",url:"https://distantreader.org/stacks/trust/uc2/uc2_ark+=13960=t4mk6787g.txt"},{k:"Second declension",verse:["Nouns in us and er become","Masculine, but Neuter um.","","Feminine are found in us,","alvus, Arctus, carbasus,","colus, humus, pampinus,","vannus: also trees, as pirus;","with some jewels, as sapphirus;","Neuter pelagus and virus.","Vulgus Neuter commonly,","rarely Masculine we see."],note:"paunch, Great Bear, linen, distaff, ground, vine-leaf, winnowing-fan, pear-tree, sapphire; sea, poison; the common people.",src:"Kennedy, The Revised Latin Primer (12th impr., 1906), Appendix IV",url:"https://distantreader.org/stacks/trust/uc2/uc2_ark+=13960=t4mk6787g.txt"},{k:"Third declension: masculine",verse:["Third-Nouns Masculine prefer","endings o, or, os, and er;","add to which the ending es,","if its Cases have increase.","","Feminine exceptions show","Substantives in do and go.","But ligo, ordo, praedo, cardo","Masculine, and Common margo.","","Abstract Nouns in io call","Feminina, one and all:","Masculine will only be","things that you may touch or see,","(as curculio, vespertilio,","pugio, scipio, and papilio)","with the Nouns that number show,","such as ternio, senio.","","Echo Feminine we name:","caro (carnis) is the same.","","Aequor, marmor, cor decline","Neuter; arbor Feminine.","","Of the Substantives in os,","Feminine are cos and dos;","while, of Latin Nouns, alone","Neuter are os (ossis), bone","and os (oris), mouth: a few","Greek in os are Neuter too.","","Many Neuters end in er,","siler, acer, verber, ver,","tuber, uber, and cadaver,","piper, iter, and papaver.","","Feminine are compes, teges,","merces, merges, quies, seges,","though their Cases have increase;","with the Neuters reckon aes."],note:"spade, order, pirate, hinge, margin; weevil, bat, dagger, staff, butterfly; three, six; flesh; sea, marble, heart, tree; whetstone, dowry; withy, maple, stripe, spring, hump, udder, carcase, pepper, journey, poppy; fetter, mat, fee, sheaf, rest, corn; copper.",src:"Kennedy, The Revised Latin Primer (12th impr., 1906), Appendix IV",url:"https://distantreader.org/stacks/trust/uc2/uc2_ark+=13960=t4mk6787g.txt"},{k:"Third declension: feminine",verse:["Third-Nouns Feminine we class","ending is, x, aus, and as,","s to consonant appended,","es in flexion unextended.","","Many Nouns in is we find","to the Masculine assigned:","amnis, axis, caulis, collis,","clunis, crinis, fascis, follis,","fustis, ignis, orbis, ensis,","panis, piscis, postis, mensis,","torris, unguis, and canalis,","vectis, vermis, and natalis,","sanguis, pulvis, cucumis,","lapis, casses, Manes, glis.","","Chiefly Masculine we find,","sometimes Feminine declined,","callis, sentis, funis, finis,","and in poets torquis, cinis.","","Masculine are most in ex:","Feminine are forfex, lex,","nex, supellex: Common, pumex,","imbrex, obex, silex, rumex.","","Add to Masculines in ix,","fornix, phoenix, and calix.","","Masculine are adamas,","elephas, mas, gigas, as:","vas (vadis) Masculine is known,","vas (vasis) is a Neuter Noun.","","Masculine are fons and mons,","chalybs, hydrops, gryps, and pons,","rudens, torrens, dens, and cliens,","fractions of the as, as triens.","Add to Masculines tridens,","oriens, and occidens,","bidens (fork): but bidens (sheep),","with the Feminines we keep.","","Masculine are found in es","verres and acinaces."],note:"river, axle, stalk, hill, hind-leg, hair, bundle, bellows, bludgeon, fire, orb, sword, bread, fish, post, month, stake, nail, canal, lever, worm, birthday, blood, dust, cucumber, stone, nets, ghosts, dormouse; path, thorn, rope, end, necklace, cinder; shears, law, death, furniture, pumice, tile, bolt, flint, sorrel; arch, phoenix, cup; adamant, elephant, male, giant, as; surety, vessel; fountain, mountain, iron, dropsy, griffin, bridge, cable, torrent, tooth, client, four ounces, trident, east, west; boar, scimitar.",src:"Kennedy, The Revised Latin Primer (12th impr., 1906), Appendix IV",url:"https://distantreader.org/stacks/trust/uc2/uc2_ark+=13960=t4mk6787g.txt"},{k:"Third declension: neuter",verse:["Third-Nouns Neuter end a, e,","ar, ur, us, c, l, n, and t.","","Masculine are found in ur","furfur, turtur, vultur, fur.","","Feminine in us a few","keep, as virtus, the long u:","servitus, juventus, salus,","senectus, tellus, incus, palus.","","Also pecus (pecudis)","Feminine in Gender is.","","Masculine appear in us","lepus (leporis) and mus.","","Masculines in l are mugil,","consul, sal, and sol, with pugil.","","Masculine are ren and splen,","pecten, delphin, attagen.","","Feminine are found in on","Gorgon, sindon, halcyon."],note:"bran, turtle-dove, vulture, thief; virtue, slavery, youth, safety, old age, earth, anvil, marsh; beast; hare, mouse; mullet, consul, salt, sun, boxer; kidney, spleen, comb, dolphin, grouse; Gorgon, muslin, kingfisher.",src:"Kennedy, The Revised Latin Primer (12th impr., 1906), Appendix IV",url:"https://distantreader.org/stacks/trust/uc2/uc2_ark+=13960=t4mk6787g.txt"},{k:"Fourth and fifth declensions",verse:["Masculines end in us: a few","are Neuter nouns, that end in u.","Women and trees are Feminine,","with acus, domus, and manus,","tribus, Idus, porticus.","","Feminine are Fifth in es,","except meridies and dies.","Dies in the Singular","Common we define:","but its Plural cases are","always Masculine."],note:"needle, house, hand, tribe, the Ides, porch; noon, day.",src:"Kennedy, The Revised Latin Primer (12th impr., 1906), Appendix IV",url:"https://distantreader.org/stacks/trust/uc2/uc2_ark+=13960=t4mk6787g.txt"}]},{id:"dat",title:"Verbs that take the dative",items:[{k:"The list",en:!0,la:"favour, help, please, trust (and their opposites); believe, persuade, command, obey, serve, resist, envy, threaten, pardon, spare",note:"So cr\u0113d\u014D tibi, fave\u014D, noce\u014D, place\u014D, c\u014Dnf\u012Bd\u014D, persu\u0101de\u014D, imper\u014D, p\u0101re\u014D, servi\u014D, resist\u014D, invide\u014D, minor, ign\u014Dsc\u014D, parc\u014D all take the dative. A&G gives the list in this order: it has been learnt as a chant for a century.",src:"Allen & Greenough \xA7 367",url:"https://dcc.dickinson.edu/grammar/latin"}]},{id:"abl5",title:"Five deponents with the ablative",items:[{k:"Learn as one line",la:"\u016Btor, fruor, fungor, potior, v\u0113scor",note:"\u201Cuse, enjoy, perform, get possession of, feed on\u201D, with their compounds, take the ablative: \u016Btor gladi\u014D, I use a sword. (potior also takes the genitive: pot\u012Br\u012B r\u0113rum, to be master of affairs.) Many teachers give the five as the acronym PUFFV, said \u201Cpuffy\u201D: potior, \u016Btor, fruor, fungor, v\u0113scor (so the Lingua Latina blog).",src:"Allen & Greenough \xA7 410; lingvalatina.com, Latin Mnemonics",url:"https://dcc.dickinson.edu/grammar/latin"}]},{id:"gender",title:"Gender by meaning",items:[{k:"The rule",en:!0,la:"Masculine: names of men, rivers, winds, months, mountains, peoples. Feminine: women, cities, countries, islands, trees. Neuter: indeclinable words and infinitives used as nouns.",note:"Kennedy\u2019s Memorial Lines on Gender put this into rhyme (below, in full); the same rule in prose is in Allen & Greenough\u2019s chapter on gender.",src:"Kennedy, Revised Latin Primer (1888), Appendix IV; Allen & Greenough, Gender",url:"https://dcc.dickinson.edu/grammar/latin"}]},{id:"verb",title:"Verb endings",items:[{k:"Personal endings",la:"-\u014D (-m), -s, -t, -mus, -tis, -nt \xB7 passive -r, -ris, -tur, -mur, -min\u012B, -ntur",note:"The nonsense phrase \u201Cmost must isn\u2019t\u201D gives the active endings (m-o-s-t, mus-t\u2026), all but the perfect\u2019s.",src:"Wikipedia, \u201CLatin mnemonics\u201D",url:"https://en.wikipedia.org/wiki/Latin_mnemonics"},{k:"Four short imperatives",la:"d\u012Bc, d\u016Bc, fac, fer",note:"From d\u012Bc\u014D, d\u016Bc\u014D, faci\u014D, fer\u014D: the -e of the imperative is dropped (but d\u012Bce, d\u016Bce, face in old Latin). Schoolchildren learnt it as a rhyme, \u201CDic, duc, fac and fer / should have an e but it isn\u2019t there\u201D (wording varies).",src:"Allen & Greenough \xA7 182",url:"https://dcc.dickinson.edu/grammar/latin"},{k:"Present subjunctive",en:!0,la:"1st -e-, 2nd -ea-, 3rd -a-, 4th -ia-",note:"\u201CWe bEAt A lIAr\u201D: amet, moneat, regat, audiat. Recorded on the Classics list in 1994 and kept in Cornell College\u2019s collection of Latin mnemonics.",src:"Cornell College, Mnemonic Devices for Learning Latin",url:"https://www.cornellcollege.edu/classical-studies/Mnemonic Devices.shtml"},{k:"Future",en:!0,la:"1st and 2nd: -b\u014D, -bis, -bit\u2026 \xB7 3rd and 4th: -am, -\u0113s, -et\u2026",note:"am\u0101b\u014D, mon\u0113b\u014D; regam, reg\u0113s; audiam, audi\u0113s. So reg\u0113s can be \u201Cyou will rule\u201D, not \u201Ckings\u201D.",src:"Allen & Greenough, the four conjugations",url:"https://dcc.dickinson.edu/grammar/latin"}]},{id:"case",title:"What the cases mean",items:[{k:"Ablative",en:!0,la:"by, with, from, in, on, at",note:"The ablative\u2019s \u201Cbasic meanings\u201D, as a modern Oxford grammar sums them up.",src:"Morwood, A Latin Grammar (Oxford, 1999), glossary",url:""},{k:"Quantity",la:"V\u014Dc\u0101lis ante v\u014Dc\u0101lem corripitur",note:"\u201CA vowel before a vowel is shortened\u201D: deus, via, f\u012Blius. The rule of the old Latin grammars; see the Meter tab in Study.",src:"Allen & Greenough, Prosody (\xA7\xA7 602 ff.)",url:"https://dcc.dickinson.edu/grammar/latin"}]},{id:"acro",title:"Acronyms and couplets",items:[{k:"DIRT: nouns with a locative",en:!0,la:"Domus (dom\u012B, at home) \xB7 \u012Ansulae, small islands (Nax\u012B, on Naxos) \xB7 R\u016Bs (r\u016Br\u012B, in the country) \xB7 Towns (R\u014Dmae, in Rome) \xB7 and the whole word DIRT for humus (hum\u012B, on the ground)",note:"The place where, without a preposition. (With most other nouns Latin uses in + ablative.)",src:"lingvalatina.com, Latin Mnemonics",url:"https://lingvalatina.com"},{k:"UNUS NAUTA: genitive -\u012Bus, dative -\u012B",en:!0,la:"\u016Bnus, n\u016Bllus, \u016Bllus, s\u014Dlus, neuter, alter, uter, t\u014Dtus, alius",note:"The initials spell UNUS NAUTA. These adjectives decline like bonus except in the genitive and dative singular: \u016Bn\u012Bus, \u016Bn\u012B; t\u014Dt\u012Bus, t\u014Dt\u012B; alter\u012Bus, alter\u012B (but alius: alter\u012Bus is used for its genitive).",src:"lingvalatina.com, Latin Mnemonics; Allen & Greenough \xA7 113",url:"https://lingvalatina.com"},{k:"suus or eius?",verse:["Use \u2018eius\u2019 when you point away-us,","but \u2018suus\u2019 for the subject\u2019s use!"],note:"suus (his own, her own, their own) refers back to the subject of its clause; eius (his, her: of someone else) points away from it. Petrus librum suum legit, Peter reads his (own) book; Petrus librum eius legit, Peter reads his (another man\u2019s) book.",src:"lingvalatina.com, Latin Mnemonics",url:"https://lingvalatina.com"},{k:"Ablative prepositions, short",verse:["Put the ablative with d\u0113,","cum and c\u014Dram, ab and \u0113,","sine, tenus, pr\u014D and prae."],note:"A shorter rhyme than Kennedy\u2019s; some teachers add a fourth line, \u201CIn and sub go either way.\u201D",src:"a reader\u2019s comment on lingvalatina.com, Latin Mnemonics (2017)",url:"https://lingvalatina.com"}]},{id:"fun",title:"For fun",items:[{k:"M\u0101l\u014D",verse:["M\u0101l\u014D: I would rather be","M\u0101l\u014D: in an apple tree","M\u0101l\u014D: than a naughty boy","M\u0101l\u014D: in adversity"],note:"Four meanings of malo: \u201CI prefer\u201D (m\u0101l\u014D), \u201Cin an apple tree\u201D (m\u0101lus), \u201Cthan a bad boy\u201D (malus, ablative of comparison), \u201Cin adversity\u201D (malum). The verse came from an old Latin grammar; Benjamin Britten set it in The Turn of the Screw.",src:"Wikipedia, \u201CLatin mnemonics\u201D (citing Lily\u2019s grammar and Britten)",url:"https://en.wikipedia.org/wiki/Latin_mnemonics"}]}];function MemoryAids(){const[e,t]=useState(()=>new Set(["prep"])),s=a=>t(n=>{const i=new Set(n);return i.has(a)?i.delete(a):i.add(a),i});return React.createElement("div",{className:"flex flex-col gap-3"},React.createElement("p",{className:"text-[15px] leading-snug text-ink"},"What generations of schoolboys learnt by heart: lists to chant, acronyms and rhymes. Each says where it comes from. Say a list aloud a few times on three or four days, and it stays."),MEMORY.map(a=>React.createElement("section",{ke
